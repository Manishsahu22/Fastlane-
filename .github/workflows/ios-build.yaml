name: iOS CI/CD Pipeline - Firebase Distribution

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      generate_certs_first:
        description: 'Set to true ONLY for the initial run to create certificates in Match repo'
        required: false
        default: 'false'

jobs:
  build-and-deploy:
    runs-on: macos-13
    
    # Permissions required for Google Workload Identity Federation (WIF)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js (For React Native / JS dependencies)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn' # Change to 'npm' if you use npm instead of yarn

      - name: Install JavaScript Dependencies
        run: |
          yarn install --frozen-lockfile # Or 'npm ci' if using npm

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Install SSH Key for Match Vault Repository
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}

      # Authenticate to Google Cloud / Firebase using Workload Identity Federation
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Step A: Run ONCE with generate_certs_first = true to push certs to your empty Match repo
      - name: Run Initial Certificate Generation (One-Time Setup)
        if: ${{ github.event.inputs.generate_certs_first == 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          bundle exec fastlane ios generate_certs

      # Step B: Regular automated build & deploy step 
      - name: Build & Deploy to Firebase
        if: ${{ github.event.inputs.generate_certs_first != 'true' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          bundle exec fastlane ios firebase_beta