name: iOS Build CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install JavaScript dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install ESLint dependencies
      - name: Install ESLint
        run: |
          npm install --no-save \
            eslint@^9.0.0 \
            eslint-config-expo@~56.0.4

      # 5. Run lint
      - name: Run lint
        run: npm run lint
        continue-on-error: true

      # 6. Generate native iOS project
      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      # 7. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 8. Run Fastlane
      - name: Build with Fastlane
        run: bundle exec fastlane ios build

      # 9. Upload iOS Simulator build
      - name: Upload iOS build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error

      # 10. Start Upterm if anything failed
      - name: Start Upterm
        if: failure()
        uses: owenthereal/action-upterm@v1
