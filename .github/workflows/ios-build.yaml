name: iOS Build CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install JavaScript dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install ESLint dependencies
      - name: Install ESLint
        run: |
          npm install --no-save \
            eslint@^9.0.0 \
            eslint-config-expo@~56.0.4

      # 5. Run lint
      - name: Run lint
        run: npm run lint

      # 6. Generate native iOS project
      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      # 7. Check generated iOS project
      - name: Check iOS files
        run: |
          echo "===== iOS directory ====="
          ls -la ios

          echo "===== Xcode projects ====="
          find ios -maxdepth 1 -name "*.xcodeproj" -print

          echo "===== Xcode workspaces ====="
          find ios -maxdepth 1 -name "*.xcworkspace" -print

      # 8. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # 9. Install Ruby dependencies
      - name: Install Ruby dependencies
        run: |
          bundle config set frozen false
          bundle lock --add-platform ruby
          bundle install

      # 10. Run Fastlane (Simulator Build - No Code Signing Required)
      - name: Build with Fastlane
        run: FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT=120 FASTLANE_XCODEBUILD_SETTINGS_RETRIES=6 bundle exec fastlane ios build

      # 11. Zip the .app bundle for artifact upload
      - name: Zip .app bundle
        run: |
          cd build_output/Build/Products/Release-iphonesimulator/
          zip -r qliniq-kiosk-simulator.zip QliniQKiosk.app

      # 12. Upload iOS build artifact (.zip containing QliniQKiosk.app)
      - name: Upload iOS build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build_output/Build/Products/Release-iphonesimulator/qliniq-kiosk-simulator.zip
          if-no-files-found: error

      # 13. Start Upterm if anything failed
      - name: Start Upterm
        if: failure()
        uses: owenthereal/action-upterm@v1
