name: Android Build (Debug APK → Firebase App Distribution)
run-name: Android Build - ${{ github.event.inputs.ref || github.ref_name }} @ ${{ github.sha }}

# Builds a debug APK for the Expo-managed app (SDK 56 / RN 0.85) and distributes
# it to Firebase App Distribution so invited testers can install it on-device.
#
# Flow: npm ci -> expo prebuild (generate android/) -> inject google-services.json
#       -> gradle assembleDebug -> upload to Firebase App Distribution.
#
# Required repository secret:
#   GOOGLE_SERVICES_JSON  - full contents of android google-services.json
#
# Required repository variables (NOT secrets — these values are not sensitive):
#   GCP_WIF_PROVIDER    - Workload Identity provider resource name, e.g.
#       projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
#   GCP_SERVICE_ACCOUNT - the SA email, e.g.
#       github-app-distribution@qliniq-kiosk.iam.gserviceaccount.com
#
# Auth is keyless via Workload Identity Federation (no downloadable SA key).
# The Firebase App ID is read from google-services.json at runtime (no secret).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: false
        default: main
        type: string
      tester_groups:
        description: 'Firebase App Distribution tester group alias(es), comma-separated'
        required: false
        default: testers
        type: string
      release_notes:
        description: 'Release notes shown to testers (defaults to the commit SHA)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation (keyless GCP auth)

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & distribute debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
      ANDROID_PACKAGE: ai.qliniq.kiosk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The hosted runner only has ~14 GB free on /, which a React Native
      # Gradle build exhausts. Remove large preinstalled toolchains we don't use
      # (keeps Android SDK/NDK, Java, Node) to reclaim ~20+ GB.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "After:"; df -h / | tail -1

      # Expo SDK 56 needs Node >= 20.19; a dependency (http-proxy-middleware)
      # requires >= 22.15, so pin Node 22.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild — generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is not set."; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Resolve Firebase App ID from google-services.json
        id: firebase
        run: |
          set -euo pipefail
          APP_ID="$(jq -r --arg pkg "$ANDROID_PACKAGE" \
            '.client[] | select(.client_info.android_client_info.package_name==$pkg) | .client_info.mobilesdk_app_id' \
            android/app/google-services.json | head -n1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            # Fallback to the first client entry.
            APP_ID="$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)"
          fi
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::Could not find Firebase App ID (mobilesdk_app_id) in google-services.json"; exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Firebase App ID: $APP_ID"

      # Build only arm64-v8a (real test devices) instead of all 4 ABIs — far
      # less disk and build time. Add more ABIs here if you need x86 emulators.
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: qliniq-kiosk-debug-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      # Keyless auth: the GitHub OIDC token is federated to the GCP service
      # account via Workload Identity Federation. No downloadable key needed
      # (org policy iam.disableServiceAccountKeyCreation blocks keys). This step
      # sets up Application Default Credentials that firebase-tools then uses.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
        run: |
          set -euo pipefail
          NOTES="${{ inputs.release_notes }}"
          [ -z "$NOTES" ] && NOTES="Build ${{ github.run_number }} — ${{ github.sha }}"
          npm install -g firebase-tools
          # firebase-tools picks up the federated credentials via ADC
          # (GOOGLE_APPLICATION_CREDENTIALS is exported by the auth step).
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "${{ inputs.tester_groups }}" \
            --release-notes "$NOTES"

      - name: Summary
        if: success()
        run: |
          {
            echo "### ✅ Android debug APK distributed"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| App | QliniQ Kiosk (\`${ANDROID_PACKAGE}\`) |"
            echo "| Firebase App ID | \`${{ steps.firebase.outputs.app_id }}\` |"
            echo "| Tester group(s) | \`${{ inputs.tester_groups }}\` |"
            echo "| Ref | \`${{ inputs.ref || github.ref_name }}\` |"
            echo ""
            echo "Testers in the group receive an email invite and can install from the Firebase App Tester app."
          } >> "$GITHUB_STEP_SUMMARY"
